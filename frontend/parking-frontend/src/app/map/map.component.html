<div style="position: relative; height: 650px; width: 100%;">
  <button class="locate-toggle" (click)="findNearestLocation()" style="position: absolute; top: 140px; right: 20px; z-index: 1000; background: rgba(0, 229, 255, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(0, 229, 255, 0.4); color: #000; padding: 12px 24px; border-radius: 30px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; cursor: pointer; box-shadow: 0 5px 25px rgba(0,0,0,0.5); transition: 0.3s; display: flex; align-items: center;">
    📍 Find Nearest Parking
  </button>
  <button class="search-toggle" (click)="goToListView()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    Search Locations
  </button>
  <button class="profile-toggle" (click)="goToProfile()" style="position: absolute; top: 20px; right: 510px; z-index: 1000; background: rgba(0, 255, 136, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(0, 255, 136, 0.4); color: #000; padding: 12px 24px; border-radius: 30px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; cursor: pointer; box-shadow: 0 5px 25px rgba(0,0,0,0.5); transition: 0.3s; display: flex; align-items: center;">
    👤 Digital Wallet
  </button>
  <button class="theme-toggle" (click)="toggleTheme()">
    🌙 Toggle Dark/Light Mode
  </button>
  <div id="map" style="height: 100%; width: 100%;"></div>
</div>
