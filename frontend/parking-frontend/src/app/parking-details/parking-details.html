<div class="page-container">
  <div class="header-section">
    <button class="back-button" (click)="goBack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Map
    </button>
    <h1>Parking spaces in Chennai</h1>
    <p>Find available parking bays across different neighbourhoods in real time.</p>
  </div>

  <div class="search-container">
    <div class="search-wrapper">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" [(ngModel)]="searchTerm" placeholder="Search by area or location (e.g., T Nagar, South Chennai)..." class="search-input">
    </div>
  </div>

  <div class="parking-grid">
    <div class="parking-card search-card-bounce" *ngFor="let parking of filteredSpots" 
         (click)="viewDetails(parking.name)"
         [ngClass]="{'selected': selectedParking === parking.name}">
      
      <div class="card-header">
        <h3>{{ parking.name }}</h3>
        <span class="status-badge" [ngClass]="parking.status.toLowerCase()">
          {{ parking.status }}
        </span>
      </div>
      
      <p class="location">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        {{ parking.location }}
      </p>
      
      <div class="availability-section">
        <div class="availability-count">
          <span>{{ parking.slots }}</span> spots left
        </div>
      </div>

      <div class="price-section" *ngIf="parking.price">
        <p class="price-label">Monthly Rent</p>
        <p class="price-tag">₹{{ parking.price.mid }} / mo</p>
      </div>

      <button class="view-button">View parking spots</button>
    </div>
  </div>
</div>
